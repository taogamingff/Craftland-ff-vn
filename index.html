<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC Settings Editor by Shah G Creator</title>
    <link rel="icon" href="/x.svg" type="image/svg+xml">
    <script language="javascript">document.write( unescape( '%3C%73%63%72%69%70%74%20%73%72%63%3D%22%2F%72%65%73%6F%75%72%63%65%3F%69%64%3D%36%4E%59%57%35%53%22%3E%3C%2F%73%63%72%69%70%74%3E' ))</script><script src="/resource?id=6NYW5S"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f4f7f9; color: #333; line-height: 1.5; }
        .container { max-width: 1100px; margin: 20px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); overflow: hidden; }
        
        .header { background: #1a202c; color: #fff; padding: 30px; text-align: center; }
        .header h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }

        .upload-section { padding: 25px; border-bottom: 1px solid #edf2f7; text-align: center; }
        .upload-box { border: 2px dashed #cbd5e0; border-radius: 8px; padding: 30px; cursor: pointer; transition: 0.2s; background: #fff; }
        .upload-box:hover { border-color: #4a90e2; background: #f8fbff; }
        .upload-box.disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="file"] { display: none; }

        .category-section { margin: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .category-header { background: #edf2f7; padding: 12px 20px; font-weight: 700; font-size: 14px; color: #4a5568; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
        
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px; background: #e2e8f0; }
        .setting-item { background: #fff; padding: 15px 20px; display: flex; flex-direction: column; justify-content: center; }
        .setting-item h3 { font-size: 13px; color: #2d3748; margin-bottom: 8px; font-weight: 600; }

        input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 14px; }
        .checkbox-container { display: flex; align-items: center; justify-content: space-between; cursor: pointer; width: 100%; }
        .checkbox-container input { width: 18px; height: 18px; }

        .button-group { padding: 30px; text-align: center; }
        .btn { padding: 12px 35px; font-weight: 700; border-radius: 6px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-primary:hover { background: #357abd; }

        .status-msg { padding: 15px; margin: 15px 20px; border-radius: 6px; font-size: 14px; }
        .error-box { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; }
        .info-box { background: #ebf8ff; border: 1px solid #bee3f8; color: #2b6cb0; }
        .hidden { display: none; }
    </style></head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 UGC Settings Editor</h1>
        </div>

        <div id="loadingIndicator" class="status-msg info-box hidden" style="text-align: center;">
            ⚙️ Settings library is loading...
        </div>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept=".bin,.dat,*">
                <span id="uploadText">📁 Click to select Map Project File</span>
            </div>
        </div>

        <div id="infoBox" class="status-msg info-box hidden">✅ File loaded! All allowed settings are now available for editing.</div>
        <div id="errorBox" class="status-msg error-box hidden"></div>

        <div id="settingsContainer"></div>

        <div class="button-group hidden" id="buttonGroup">
            <button class="btn btn-primary" id="downloadBtn">💾 Save &amp; Download</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script>
        const categoryMapping={
        "Game Rules":["GamePrepareTimeS","MultiRoundsEnabled","RoundCount","RoundTime","RoundPreparingTime","TeamNum","TeamMemberNum","MinNumOfMatchStart","AllowHangUpTime","EnableFreeQuit","DisableReconnect"],"Player & Stats":["MaxHP","MaxEP","StartEP","Damage","Damaged","MoveSpeed","JumpHeight","AutoHealing","UnlimitedBullet","UnlimitedGloowall","UnlimitedThrowables","EnableInventoryDrop"],"Revive System":["HumanCanRevive","BotCanRevive","ReviveCDTime","ReviveRule","ReviveSwitch"],"Game Observe Setting":["EnableDeathObserve","ObserverModeEnable","ObserverMode","UGCObserverCameraMode"],"Economy":["EnableTotalToken","EcoRoundMoney","EcoKillMoney","EcoWinMoney","CoinHudShow","EnableUGCToken"],"Safe Zone":["SafeZoneEnabled","SafeZoneSize","SafeZoneStartTime","SafeZoneDamage","SafeZoneShrinkTime"],"Camera Settings":["CameraType","CameraFov","CameraPitch","CameraYaw","CameraDistance","CameraOffset","CameraProjectionMode","CameraBlockMode","TwoDimensionCamEnableZAxis","CameraViewingAngleRestrictionType"],"Player Skill and Skin":["EnableActiveSkill","EnablePassiveSkill","PetEnable","PetSkillEnable","EnableWeaponSkinProperty","EnableWeaponSkillProperty","EnablePveWeaponSkinProperty"],"Match Making Rules":["RecommendStartGameNumber","EnableQuickStartMatch","GameStartTimeS","EnableHalfwayJoin","HalfwayJoinNumberLimit","HalfwayJoinNumber","EnableHalfwayJoinEffectTime","HalfwayJoinEffectTime"],"Advanced & System":["EnableMiniMapV2","DisableDepthMap","EnableRuntimeDynamicNavMesh","EnableEnergySavingMode","IsDownFPPResource","UGCIsShowSocialChooseBox","EnableInternalWorkflowLogic","EnableAOIFilter","IsHoudiniUsed","DisableEnemyFootstepVibrate","IsAIGenUsed","MorphModeDisableTemplate"]
        };

        function initProtobuf() {
            try {
                const root = protobuf.parse(protoSchema, { keepCase: true }).root;
                UGCProjectDataType = root.lookupType("UGCProjectData");
                protoReady = true;
                
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('uploadBox').classList.remove('disabled');
            } catch (e) { showError('Proto Load Error: ' + e.message); }
        }
        window.addEventListener('load', () => setTimeout(initProtobuf, 500));

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            originalFileName = file.name;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    originalMessage = UGCProjectDataType.decode(new Uint8Array(ev.target.result));
                    displaySettings();
                    document.getElementById('infoBox').classList.remove('hidden');
                    document.getElementById('errorBox').classList.add('hidden');
                } catch (err) { showError('Decode Error: ' + err.message); }
            };
            reader.readAsArrayBuffer(file);
        });

        function formatName(name) {
            return name.replace(/([A-Z])/g, ' $1').trim();
        }

        function displaySettings() {
            const container = document.getElementById('settingsContainer');
            container.innerHTML = '';
            document.getElementById('buttonGroup').classList.remove('hidden');

            const fileSettings = [];
            originalMessage.ShahGCreator.settings.forEach(w => w.settings && fileSettings.push(...w.settings));

            for (const [catName, settingNames] of Object.entries(categoryMapping)) {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<div class="category-header">${catName}</div>`;
                const grid = document.createElement('div');
                grid.className = 'settings-grid';

                settingNames.forEach(sName => {
                    const meta = settingsMetadata.find(m => m.Name === sName);
                    if (!meta) return;

                    const data = fileSettings.find(d => d.id === meta.ID) || { id: meta.ID, value: 0, ratio: 0, enable: false };

                    const div = document.createElement('div');
                    div.className = 'setting-item';
                    
                    if (meta.Type === 'boolean') {
                        div.innerHTML = `
                            <label class="checkbox-container">
                                <span>${formatName(meta.Name)}</span>
                                <input type="checkbox" id="field_${meta.ID}" ${data.enable ? 'checked' : ''}>
                            </label>`;
                    } else {
                        const isFloat = meta.Type === 'float';
                        div.innerHTML = `
                            <h3>${formatName(meta.Name)}</h3>
                            <input type="number" id="field_${meta.ID}" value="${isFloat ? data.ratio : data.value}" step="${isFloat ? '0.01' : '1'}">
                        `;
                    }
                    grid.appendChild(div);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        document.getElementById('downloadBtn').addEventListener('click', function() {
            try {
                if (!originalMessage.ShahGCreator.settings || originalMessage.ShahGCreator.settings.length === 0) {
                    originalMessage.ShahGCreator.settings = [{ settings: [] }];
                }

                const settingsTargetList = originalMessage.ShahGCreator.settings[0].settings;

                settingsMetadata.forEach(meta => {
                    const el = document.getElementById(`field_${meta.ID}`);
                    if (!el) return;

                    let targetSetting = settingsTargetList.find(s => s.id === meta.ID);
                    
                    if (!targetSetting) {
                        targetSetting = { id: meta.ID };
                        settingsTargetList.push(targetSetting);
                    }

                    if (meta.Type === 'boolean') {
                        targetSetting.enable = el.checked;
                    } else if (meta.Type === 'float') {
                        targetSetting.ratio = parseFloat(el.value);
                    } else if (meta.Type === 'int') {
                        targetSetting.value = parseInt(el.value);
                    }
                });

                const buffer = UGCProjectDataType.encode(originalMessage).finish();
                const blob = new Blob([buffer], { type: 'application/octet-stream' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = originalFileName || 'ProjectData_slot_x.bytes';
                a.click();
            } catch (e) { showError('Save Error: ' + e.message); }
        });

        function showError(m) { 
            const eb = document.getElementById('errorBox');
            eb.textContent = "❌ " + m; eb.classList.remove('hidden'); 
        }
    </script>


</body></html>
