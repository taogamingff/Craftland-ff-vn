<title>Craftland Free Fire 🔥 - Trình chỉnh sửa UGC</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --gold:#ffd000;
    --gold2:#ffb000;
    --black:#050505;
    --panel:#0d0d0f;
    --panel2:#121214;
    --line:rgba(255,208,0,.18);
    --text:#f5f5f5;
    --muted:#969696;
}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    color:var(--text);
    font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(255,208,0,.10),transparent 25%),
        radial-gradient(circle at 90% 75%,rgba(255,176,0,.07),transparent 30%),
        linear-gradient(120deg,#020202,#0b0b0c 48%,#030303);
    overflow-x:hidden;
}
body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.28;
    background:
        linear-gradient(115deg,transparent 0 45%,rgba(255,255,255,.018) 45.2% 45.4%,transparent 45.6%),
        linear-gradient(65deg,transparent 0 58%,rgba(255,208,0,.025) 58.2% 58.35%,transparent 58.55%);
    z-index:-1;
}
body:after{
    content:"";
    position:fixed;
    width:420px;height:420px;
    right:-180px;top:-170px;
    border:1px solid rgba(255,208,0,.08);
    border-radius:50%;
    box-shadow:
        0 0 0 55px rgba(255,208,0,.025),
        0 0 0 110px rgba(255,208,0,.018),
        0 0 80px rgba(255,208,0,.08);
    pointer-events:none;
    z-index:-1;
}
.app{
    width:min(1180px,calc(100% - 24px));
    margin:18px auto;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(7,7,8,.92);
    box-shadow:0 35px 90px rgba(0,0,0,.65),0 0 70px rgba(255,208,0,.035);
    border-radius:26px;
    overflow:hidden;
}
.header{
    min-height:225px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 22px;
    background:
        linear-gradient(180deg,rgba(255,255,255,.025),transparent 70%),
        #080808;
    border-bottom:1px solid rgba(255,208,0,.16);
}
.header:before{
    content:"";
    position:absolute;
    left:7%;right:7%;bottom:20px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    box-shadow:0 0 18px rgba(255,208,0,.45);
}
.logo-wrap{
    position:relative;
    width:min(700px,92%);
    padding:14px 22px;
    transform:perspective(900px) rotateX(1deg);
}
.logo-wrap:before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(255,208,0,.10),transparent 35%,rgba(255,208,0,.035));
    border:1px solid rgba(255,208,0,.12);
    clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);
}
.logo-wrap img{
    position:relative;
    z-index:2;
    display:block;
    width:100%;
    height:auto;
    max-height:190px;
    object-fit:contain;
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 12px rgba(255,208,0,.18));
}
.logo-wrap:after{
    content:"";
    position:absolute;
    width:90px;height:90px;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,208,0,.08);
    filter:blur(28px);
    pointer-events:none;
}
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:16px 20px;
    background:#0a0a0b;
    border-bottom:1px solid rgba(255,255,255,.07);
}
.brand-small{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    font-weight:900;
    letter-spacing:1.4px;
    text-transform:uppercase;
}
.brand-dot{
    width:9px;height:9px;border-radius:2px;
    background:var(--gold);
    transform:rotate(45deg);
    box-shadow:0 0 14px rgba(255,208,0,.7);
}
.system-pill{
    padding:7px 11px;
    border:1px solid rgba(255,208,0,.18);
    border-radius:99px;
    color:#d8d8d8;
    font-size:10px;
    font-weight:800;
    letter-spacing:.6px;
    background:#101011;
}
.upload-section{
    padding:22px 20px;
    display:flex;
    justify-content:center;
    background:#090909;
}
.upload-box{
    width:min(520px,100%);
    min-height:82px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:14px 17px;
    cursor:pointer;
    border:1px solid rgba(255,208,0,.25);
    border-radius:16px;
    background:
        linear-gradient(135deg,#151515,#0b0b0c);
    box-shadow:
        10px 10px 25px rgba(0,0,0,.38),
        -6px -6px 18px rgba(255,255,255,.018),
        inset 0 1px 0 rgba(255,255,255,.06);
    transition:.25s ease;
}
.upload-box:hover{
    transform:translateY(-3px);
    border-color:rgba(255,208,0,.62);
    box-shadow:
        0 18px 35px rgba(0,0,0,.5),
        0 0 28px rgba(255,208,0,.08),
        inset 0 1px 0 rgba(255,255,255,.08);
}
.upload-box:active{transform:translateY(0) scale(.99)}
.upload-icon{
    width:48px;height:48px;
    flex:0 0 48px;
    display:grid;place-items:center;
    color:#0a0a0a;
    font-size:27px;
    font-weight:900;
    background:linear-gradient(145deg,#ffe45a,var(--gold2));
    clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
    box-shadow:0 8px 20px rgba(0,0,0,.35),0 0 18px rgba(255,208,0,.2);
}
.upload-title{font-size:14px;font-weight:950;letter-spacing:.4px}
.upload-sub{margin-top:3px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.7px}
input[type=file]{display:none}
.status-msg{
    margin:16px 20px;
    padding:13px 15px;
    border-radius:12px;
    font-size:13px;
}
.info-box{
    color:#e9d98a;
    background:rgba(255,208,0,.045);
    border:1px solid rgba(255,208,0,.16);
}
.error-box{
    color:#ffb0b0;
    background:rgba(255,50,60,.06);
    border:1px solid rgba(255,70,80,.28);
}
.hidden{display:none!important}
.category-section{
    margin:18px 20px;
    border:1px solid rgba(255,255,255,.075);
    border-radius:18px;
    overflow:hidden;
    background:#0a0a0b;
    box-shadow:0 18px 45px rgba(0,0,0,.32);
}
.category-header{
    min-height:58px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 18px;
    color:#fff;
    font-size:13px;
    font-weight:950;
    letter-spacing:.8px;
    text-transform:uppercase;
    background:
        linear-gradient(90deg,rgba(255,208,0,.09),transparent 55%),
        #101011;
    border-bottom:1px solid rgba(255,255,255,.07);
}
.category-header:before{
    content:"";
    width:4px;height:27px;
    background:var(--gold);
    box-shadow:0 0 14px rgba(255,208,0,.55);
    transform:skewX(-16deg);
}
.settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:1px;
    background:rgba(255,255,255,.06);
}
.setting-item{
    position:relative;
    min-height:86px;
    padding:16px 17px;
    background:#0e0e0f;
    transition:.2s ease;
}
.setting-item:hover{
    background:#141415;
    box-shadow:inset 3px 0 0 rgba(255,208,0,.7);
}
.setting-item h3{
    margin-bottom:9px;
    font-size:12px;
    font-weight:850;
    color:#dedede;
}
input[type=number]{
    width:100%;
    padding:10px 11px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.10);
    outline:none;
    background:#070708;
    color:#fff;
    font-size:13px;
    font-weight:700;
}
input[type=number]:focus{
    border-color:rgba(255,208,0,.62);
    box-shadow:0 0 0 3px rgba(255,208,0,.07);
}
.checkbox-container{
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    cursor:pointer;
    color:#ddd;
    font-size:12px;
    font-weight:800;
}
.checkbox-container input{
    appearance:none;
    width:49px;height:27px;
    flex:0 0 49px;
    position:relative;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.15);
    background:#050505;
    cursor:pointer;
    transition:.22s ease;
}
.checkbox-container input:before{
    content:"";
    position:absolute;
    width:17px;height:17px;
    left:4px;top:4px;
    border-radius:3px;
    background:#777;
    transition:.22s ease;
}
.checkbox-container input:checked{
    background:var(--gold);
    border-color:var(--gold);
    box-shadow:0 0 15px rgba(255,208,0,.22);
}
.checkbox-container input:checked:before{
    transform:translateX(22px);
    background:#111;
}
.button-group{
    padding:30px 20px 40px;
    display:flex;
    justify-content:center;
}
.btn{
    position:relative;
    min-width:265px;
    padding:14px 25px;
    border:0;
    border-radius:9px;
    cursor:pointer;
    color:#080808;
    background:linear-gradient(135deg,#ffe45a,var(--gold2) 58%,#e7a500);
    font-size:13px;
    font-weight:950;
    letter-spacing:.6px;
    box-shadow:8px 8px 20px rgba(0,0,0,.45),0 0 22px rgba(255,208,0,.12);
    transition:.22s ease;
}
.btn:hover{
    transform:translateY(-3px);
    filter:brightness(1.06);
    box-shadow:12px 15px 30px rgba(0,0,0,.55),0 0 32px rgba(255,208,0,.2);
}
.btn:active{transform:translateY(0) scale(.985)}
.footer{
    padding:16px 20px 20px;
    text-align:center;
    color:#5f5f61;
    font-size:9px;
    letter-spacing:1px;
}
@media(max-width:700px){
    .app{width:calc(100% - 10px);margin:5px auto;border-radius:19px}
    .header{min-height:170px;padding:25px 10px}
    .logo-wrap{width:96%;padding:8px 10px}
    .logo-wrap img{max-height:125px}
    .topbar{padding:13px 14px}
    .system-pill{font-size:8px}
    .upload-section{padding:16px 12px}
    .upload-box{min-height:76px}
    .category-section{margin:13px 12px}
    .settings-grid{grid-template-columns:1fr}
    .status-msg{margin:13px 12px}
    .button-group{padding:24px 13px 30px}
    .btn{width:100%;min-width:0}
}
@media(prefers-reduced-motion:reduce){
    *,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>

    repeated SettingsWrapper settings = 1;

}

message SettingsWrapper {

}

message Settings {

    bool enable = 2;
    int32 value = 3;
    float ratio = 4;
}

let UGCProjectDataType=null;
let originalMessage=null;
let originalFileName="";

function showError(message){
    const el=document.getElementById("errorBox");
    el.textContent="Lỗi: "+message;
    el.classList.remove("hidden");
}

function getVietnameseName(name){
    return vietnameseNames[name]||name;
}

function initProtobuf(){
    const loadingEl=document.getElementById("loadingIndicator");
    const uploadBox=document.getElementById("uploadBox");

    if(typeof protobuf==="undefined"){
        loadingEl.className="status-msg error-box";
        loadingEl.textContent="Không thể tải thư viện Protobuf. Hãy kiểm tra kết nối mạng.";
        return;
    }

    try{
        const root=protobuf.parse(protoSchema,{keepCase:true}).root;
        UGCProjectDataType=root.lookupType("UGCProjectData");
        UGCProjectDataType.encode(UGCProjectDataType.create({})).finish();
        loadingEl.classList.add("hidden");
        uploadBox.classList.remove("disabled");
    }catch(e){
        loadingEl.className="status-msg error-box";
        loadingEl.textContent="Lỗi khởi tạo Protobuf: "+e.message;
    }
}

function displaySettings(){
    const container=document.getElementById("settingsContainer");
    container.innerHTML="";
    document.getElementById("buttonGroup").classList.remove("hidden");

    const fileSettings=[];
    if(originalMessage.craftlandff && Array.isArray(originalMessage.craftlandff.settings)){
        originalMessage.craftlandff.settings.forEach(wrapper=>{
            if(wrapper && Array.isArray(wrapper.settings)) fileSettings.push(...wrapper.settings);
        });
    }

    for(const [categoryName,settingNames] of Object.entries(categoryMapping)){
        const section=document.createElement("section");
        section.className="category-section";

        const header=document.createElement("div");
        header.className="category-header";
        header.textContent=categoryName;
        section.appendChild(header);

        const grid=document.createElement("div");
        grid.className="settings-grid";

        settingNames.forEach(settingName=>{
            const meta=settingsMetadata.find(item=>item.Name===settingName);
            if(!meta)return;

            const data=fileSettings.find(item=>item.id===meta.ID) || {
                id:meta.ID,value:0,ratio:0,enable:false
            };

            const item=document.createElement("div");
            item.className="setting-item";
            const displayName=getVietnameseName(meta.Name);

            if(meta.Type==="boolean"){
                item.innerHTML=`
                    <label class="checkbox-container">
                        <span>${displayName}</span>
                        <input type="checkbox" id="field_${meta.ID}" ${data.enable?"checked":""}>
                    </label>`;
            }else{
                const isFloat=meta.Type==="float";
                const value=isFloat?(data.ratio||0):(data.value||0);
                item.innerHTML=`
                    <h3>${displayName}</h3>
                    <input type="number" id="field_${meta.ID}" value="${value}" step="${isFloat?"0.01":"1"}">`;
            }
            grid.appendChild(item);
        });

        section.appendChild(grid);
        container.appendChild(section);
    }
}

document.addEventListener("DOMContentLoaded",()=>{
    initProtobuf();

    document.getElementById("fileInput").addEventListener("change",e=>{
        const file=e.target.files[0];
        if(!file)return;

        if(!UGCProjectDataType){
            showError("Hệ thống chưa sẵn sàng.");
            return;
        }

        originalFileName=file.name;
        const reader=new FileReader();

        reader.onload=ev=>{
            try{
                originalMessage=UGCProjectDataType.decode(new Uint8Array(ev.target.result));
                displaySettings();
                document.getElementById("infoBox").classList.remove("hidden");
                document.getElementById("errorBox").classList.add("hidden");
            }catch(err){
                showError("Không thể đọc file: "+err.message);
            }
        };

        reader.readAsArrayBuffer(file);
    });

    document.getElementById("downloadBtn").addEventListener("click",()=>{
        try{
            if(!UGCProjectDataType)throw new Error("Protobuf chưa sẵn sàng.");
            if(!originalMessage)throw new Error("Chưa có file nào được tải lên.");

            if(!originalMessage.craftlandff){
                originalMessage.craftlandff={settings:[],version:0};
            }

            if(!Array.isArray(originalMessage.craftlandff.settings) || originalMessage.craftlandff.settings.length===0){
                originalMessage.craftlandff.settings=[{settings:[]}];
            }

            const wrapper=originalMessage.craftlandff.settings[0];
            const settingsTargetList=Array.isArray(wrapper.settings)?wrapper.settings:(wrapper.settings=[]);

            settingsMetadata.forEach(meta=>{
                const element=document.getElementById(`field_${meta.ID}`);
                if(!element)return;

                let target=settingsTargetList.find(setting=>setting.id===meta.ID);

                if(!target){
                    target={id:meta.ID,enable:false,value:0,ratio:0};
                    settingsTargetList.push(target);
                }

                if(meta.Type==="boolean"){
                    target.enable=element.checked;
                }else if(meta.Type==="float"){
                    target.ratio=parseFloat(element.value)||0;
                }else{
                    target.value=parseInt(element.value,10)||0;
                }
            });

            const buffer=UGCProjectDataType.encode(originalMessage).finish();
            const blob=new Blob([buffer],{type:"application/octet-stream"});
            const url=URL.createObjectURL(blob);
            const link=document.createElement("a");

            link.href=url;
            link.download=originalFileName||"ProjectData_slot_x.bytes";
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(()=>URL.revokeObjectURL(url),1000);
        }catch(error){
            showError("Lỗi khi lưu file: "+error.message);
        }
    });
});
