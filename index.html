<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Craftland Free Fire 🔥 - Trình chỉnh sửa UGC</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --cyan: #00e5ff;
            --green: #00ff9d;
            --blue: #1677ff;
            --purple: #7957ff;
            --bg: #020711;
            --panel: rgba(6, 15, 29, .88);
            --panel2: rgba(10, 23, 42, .92);
            --text: #edf9ff;
            --muted: #91a9bd;
        }

        body {
            font-family:
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0,229,255,.17),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(0,255,157,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(121,87,255,.16),
                    transparent 34%
                ),
                linear-gradient(
                    135deg,
                    #01040a 0%,
                    #03101c 42%,
                    #02050b 100%
                );
        }

        /* GRID NỀN */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: -5;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black 0%,
                    rgba(0,0,0,.8) 45%,
                    transparent 100%
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    black 0%,
                    rgba(0,0,0,.8) 45%,
                    transparent 100%
                );
        }

        /* ÁNH SÁNG 3D */

        body::after {
            content: "";

            position: fixed;
            width: 480px;
            height: 480px;

            left: -220px;
            bottom: -230px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0,229,255,.16),
                    transparent 68%
                );

            filter: blur(45px);

            pointer-events: none;
            z-index: -4;

            animation: ambientMove 8s ease-in-out infinite;
        }

        @keyframes ambientMove {
            0%,100% {
                transform: translate3d(0,0,0);
            }

            50% {
                transform: translate3d(40px,-25px,0);
            }
        }

        /* CONTAINER */

        .container {
            position: relative;

            width: calc(100% - 24px);
            max-width: 1150px;

            margin: 20px auto;

            background:
                linear-gradient(
                    145deg,
                    rgba(7,17,32,.94),
                    rgba(2,7,15,.96)
                );

            border:
                1px solid rgba(255,255,255,.10);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 40px 100px rgba(0,0,0,.65),
                0 0 80px rgba(0,229,255,.06),
                inset 0 1px 0 rgba(255,255,255,.07);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            transform: translateZ(0);
        }

        .container::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            border-radius: inherit;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,229,255,.055),
                    transparent 28%,
                    transparent 70%,
                    rgba(0,255,157,.035)
                );
        }

        /* HEADER */

        .header {
            position: relative;

            min-height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;

            text-align: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% -50%,
                    rgba(0,229,255,.30),
                    transparent 55%
                ),
                linear-gradient(
                    135deg,
                    rgba(0,229,255,.10),
                    rgba(0,255,157,.04),
                    rgba(121,87,255,.10)
                ),
                rgba(2,8,17,.94);

            border-bottom:
                1px solid rgba(0,229,255,.20);

            box-shadow:
                inset 0 -20px 60px rgba(0,0,0,.20);
        }

        /* đường sáng */

        .header::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    var(--green),
                    var(--cyan),
                    transparent
                );

            box-shadow:
                0 0 8px var(--cyan),
                0 0 25px rgba(0,229,255,.7);
        }

        .header::before {
            content: "";

            position: absolute;

            width: 360px;
            height: 360px;

            top: -260px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0,229,255,.20),
                    transparent 68%
                );

            filter: blur(25px);

            animation:
                headerGlow 5s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%,100% {
                opacity: .65;
                transform: translateX(-50%) scale(1);
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.12);
            }
        }

        .header h1 {
            position: relative;
            z-index: 2;

            font-size:
                clamp(25px, 6vw, 44px);

            font-weight: 900;

            letter-spacing:
                clamp(1px, .35vw, 3px);

            text-transform: uppercase;

            color: #ffffff;

            text-shadow:
                0 2px 0 #020912,
                0 4px 0 rgba(0,0,0,.35),
                0 0 12px rgba(0,229,255,.95),
                0 0 32px rgba(0,229,255,.45),
                0 0 60px rgba(0,255,157,.18);

            transform:
                perspective(500px)
                translateZ(30px);
        }

        .header h1::after {
            content: "";

            display: block;

            width: 135px;
            height: 3px;

            margin:
                17px auto 0;

            border-radius: 99px;

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    var(--green)
                );

            box-shadow:
                0 0 8px var(--cyan),
                0 0 22px rgba(0,255,157,.65);
        }

        /* UPLOAD */

        .upload-section {
            padding: 30px;

            border-bottom:
                1px solid rgba(255,255,255,.07);
        }

        .upload-box {
            position: relative;

            min-height: 125px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            border:
                2px dashed rgba(0,229,255,.40);

            border-radius: 18px;

            text-align: center;

            cursor: pointer;

            color: #dff8ff;

            background:
                linear-gradient(
                    145deg,
                    rgba(0,229,255,.08),
                    rgba(0,255,157,.035)
                ),
                rgba(255,255,255,.018);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.06),
                inset 0 0 35px rgba(0,229,255,.025),
                0 15px 35px rgba(0,0,0,.22);

            transition:
                .3s ease;
        }

        .upload-box:hover {
            transform:
                translateY(-4px)
                perspective(700px)
                rotateX(2deg);

            border-color:
                var(--cyan);

            background:
                linear-gradient(
                    145deg,
                    rgba(0,229,255,.14),
                    rgba(0,255,157,.055)
                ),
                rgba(255,255,255,.025);

            box-shadow:
                0 22px 50px rgba(0,0,0,.38),
                0 0 35px rgba(0,229,255,.12),
                inset 0 0 35px rgba(0,229,255,.04);
        }

        .upload-box::before {
            content: "✦";

            position: absolute;

            top: 9px;
            right: 18px;

            color: var(--cyan);

            font-size: 18px;

            animation:
                starFloat 3s ease-in-out infinite;
        }

        .upload-box::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            pointer-events: none;

            background:
                linear-gradient(
                    115deg,
                    transparent 20%,
                    rgba(255,255,255,.055) 50%,
                    transparent 80%
                );

            transform:
                translateX(-120%);

            transition:
                transform .7s ease;
        }

        .upload-box:hover::after {
            transform:
                translateX(120%);
        }

        .upload-box.disabled {
            opacity: .45;
            pointer-events: none;
        }

        input[type="file"] {
            display: none;
        }

        @keyframes starFloat {
            0%,100% {
                transform: translateY(0);
                opacity: .45;
            }

            50% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* MESSAGE */

        .status-msg {
            margin: 18px 22px;

            padding: 14px 17px;

            border-radius: 11px;

            font-size: 14px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .info-box {
            color: #a8efff;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,190,255,.10),
                    rgba(0,255,157,.035)
                );

            border:
                1px solid rgba(0,229,255,.25);

            box-shadow:
                0 0 25px rgba(0,190,255,.05);
        }

        .error-box {
            color: #ffadb7;

            background:
                rgba(255,50,75,.08);

            border:
                1px solid rgba(255,70,90,.35);

            box-shadow:
                0 0 25px rgba(255,50,75,.06);
        }

        /* CATEGORY */

        .category-section {
            position: relative;

            margin: 22px;

            overflow: hidden;

            border:
                1px solid rgba(255,255,255,.09);

            border-radius: 18px;

            background:
                rgba(255,255,255,.015);

            box-shadow:
                0 15px 40px rgba(0,0,0,.26),
                inset 0 1px 0 rgba(255,255,255,.035);

            transition:
                .28s ease;
        }

        .category-section:hover {
            transform:
                translateY(-2px);

            border-color:
                rgba(0,229,255,.20);

            box-shadow:
                0 22px 50px rgba(0,0,0,.34),
                0 0 25px rgba(0,229,255,.045);
        }

        .category-header {
            position: relative;

            padding:
                16px 21px;

            font-size: 14px;

            font-weight: 900;

            letter-spacing:
                .8px;

            text-transform:
                uppercase;

            color:
                #ecfcff;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,229,255,.12),
                    rgba(0,255,157,.045),
                    transparent
                );

            border-bottom:
                1px solid rgba(255,255,255,.08);

            text-shadow:
                0 0 12px rgba(0,229,255,.35);
        }

        .category-header::before {
            content: "";

            display: inline-block;

            width: 8px;
            height: 8px;

            margin-right: 10px;

            border-radius: 50%;

            vertical-align: 1px;

            background:
                var(--cyan);

            box-shadow:
                0 0 8px var(--cyan),
                0 0 18px rgba(0,229,255,.65);
        }

        /* SETTINGS */

        .settings-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(300px,1fr)
                );

            gap: 1px;

            background:
                rgba(255,255,255,.055);
        }

        .setting-item {
            position: relative;

            min-height: 78px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding:
                16px 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(12,25,43,.98),
                    rgba(4,12,23,.98)
                );

            transition:
                .22s ease;

            overflow: hidden;
        }

        .setting-item::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    rgba(255,255,255,.035) 50%,
                    transparent 80%
                );

            transform:
                translateX(-120%);

            transition:
                transform .55s ease;
        }

        .setting-item:hover {
            z-index: 2;

            transform:
                translateY(-2px)
                scale(1.008);

            background:
                linear-gradient(
                    145deg,
                    rgba(14,38,58,.98),
                    rgba(5,20,31,.98)
                );

            box-shadow:
                0 10px 25px rgba(0,0,0,.30),
                inset 0 0 25px rgba(0,229,255,.025);
        }

        .setting-item:hover::before {
            transform:
                translateX(120%);
        }

        .setting-item h3 {
            position: relative;

            font-size: 13px;

            color:
                #d9edf9;

            margin-bottom:
                9px;

            font-weight:
                750;

            letter-spacing:
                .15px;
        }

        /* INPUT */

        input[type="number"] {
            width: 100%;

            padding:
                10px 12px;

            color:
                #ecfbff;

            background:
                rgba(0,0,0,.30);

            border:
                1px solid rgba(150,190,220,.18);

            border-radius:
                9px;

            font-size:
                14px;

            outline:
                none;

            transition:
                .2s ease;
        }

        input[type="number"]:focus {
            border-color:
                var(--cyan);

            background:
                rgba(0,229,255,.045);

            box-shadow:
                0 0 0 2px rgba(0,229,255,.08),
                0 0 18px rgba(0,229,255,.10);
        }

        /* SWITCH */

        .checkbox-container {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            cursor: pointer;

            color:
                #dcecff;

            font-size:
                13px;

            font-weight:
                700;
        }

        .checkbox-container input {
            appearance: none;
            -webkit-appearance: none;

            position: relative;

            width: 46px;
            height: 24px;

            flex:
                0 0 46px;

            border:
                1px solid rgba(160,190,215,.25);

            border-radius:
                30px;

            background:
                #111c29;

            cursor:
                pointer;

            transition:
                .25s ease;
        }

        .checkbox-container input::before {
            content: "";

            position: absolute;

            width: 18px;
            height: 18px;

            top: 2px;
            left: 3px;

            border-radius:
                50%;

            background:
                #78899b;

            box-shadow:
                0 2px 6px rgba(0,0,0,.5);

            transition:
                .25s ease;
        }

        .checkbox-container input:checked {
            background:
                linear-gradient(
                    90deg,
                    #007db8,
                    #00c978
                );

            border-color:
                rgba(0,229,255,.70);

            box-shadow:
                0 0 12px rgba(0,229,255,.25);
        }

        .checkbox-container input:checked::before {
            transform:
                translateX(21px);

            background:
                #fff;

            box-shadow:
                0 0 9px rgba(255,255,255,.7),
                0 2px 6px rgba(0,0,0,.4);
        }

        /* BUTTON */

        .button-group {
            padding:
                32px 25px 40px;

            text-align:
                center;
        }

        .btn {
            position: relative;

            min-width:
                230px;

            padding:
                14px 36px;

            border:
                1px solid rgba(255,255,255,.16);

            border-radius:
                11px;

            cursor:
                pointer;

            font-size:
                14px;

            font-weight:
                900;

            letter-spacing:
                .4px;

            overflow:
                hidden;

            transition:
                .22s ease;
        }

        .btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.28),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left .55s ease;
        }

        .btn:hover::before {
            left:
                140%;
        }

        .btn-primary {
            color:
                #001015;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    var(--green)
                );

            box-shadow:
                0 12px 35px rgba(0,229,255,.22),
                0 0 25px rgba(0,255,157,.13),
                inset 0 1px 0 rgba(255,255,255,.5);

            text-shadow:
                0 1px rgba(255,255,255,.35);
        }

        .btn-primary:hover {
            transform:
                translateY(-4px)
                scale(1.025);

            filter:
                brightness(1.08);

            box-shadow:
                0 18px 45px rgba(0,229,255,.30),
                0 0 35px rgba(0,255,157,.22),
                inset 0 1px 0 rgba(255,255,255,.55);
        }

        .btn-primary:active {
            transform:
                translateY(0)
                scale(.99);
        }

        .hidden {
            display:
                none !important;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                width:
                    calc(100% - 14px);

                margin:
                    7px auto;

                border-radius:
                    18px;
            }

            .header {
                min-height:
                    155px;

                padding:
                    34px 15px;
            }

            .header h1 {
                font-size:
                    24px;

                letter-spacing:
                    1px;
            }

            .upload-section {
                padding:
                    20px;
            }

            .upload-box {
                min-height:
                    115px;

                padding:
                    25px 15px;
            }

            .category-section {
                margin:
                    14px;
            }

            .settings-grid {
                grid-template-columns:
                    1fr;
            }

            .setting-item {
                min-height:
                    72px;
            }

            .button-group {
                padding:
                    25px 18px 32px;
            }

            .btn {
                width:
                    100%;

                min-width:
                    0;
            }

            .status-msg {
                margin:
                    15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>🔥 Craftland Free Fire 🔥</h1>
    </div>

    <!-- LOADING -->

    <div
        id="loadingIndicator"
        class="status-msg info-box"
        style="text-align:center;"
    >
        ⚙️ Đang tải hệ thống Protobuf...
    </div>

    <!-- UPLOAD -->

    <div class="upload-section">

        <div
            class="upload-box disabled"
            id="uploadBox"
        >

            <input
                type="file"
                id="fileInput"
                accept=".bin,.dat,.bytes,*"
            >

            <span id="uploadText">
                📁 Nhấn để chọn File Map Project
            </span>

        </div>

    </div>

    <!-- INFO -->

    <div
        id="infoBox"
        class="status-msg info-box hidden"
    >
        ✅ Đã tải file thành công!
        Bạn có thể chỉnh sửa các cài đặt bên dưới.
    </div>

    <!-- ERROR -->

    <div
        id="errorBox"
        class="status-msg error-box hidden"
    ></div>

    <!-- SETTINGS -->

    <div id="settingsContainer"></div>

    <!-- DOWNLOAD -->

    <div
        class="button-group hidden"
        id="buttonGroup"
    >

        <button
            class="btn btn-primary"
            id="downloadBtn"
        >
            💾 Lưu & Tải File Xuống
        </button>

    </div>

</div>


<!-- PROTOBUF.JS -->

<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>


<script>

/* ============================================================
   1. PROTOBUF SCHEMA
   ============================================================ */

const protoSchema = `
    syntax = "proto3";

    message UGCProjectData {

        bytes graph_editor_project = 1;
        bytes workflow_editor_project = 2;
        bytes entity_editor_project = 3;
        bytes hud_editor_project = 4;
        bytes map_editor_project = 5;

        Root ShahGCreator = 6;

        uint64 author_uid = 7;

        bytes custom_resources_package = 8;
        bytes timeline_editor_project = 9;
        bytes user_custom_event_editor_project = 10;

        int32 compatible_version = 999;
        int32 public_version = 1000;
    }

    message Root {

        repeated SettingsWrapper settings = 1;

        int32 version = 3;
    }

    message SettingsWrapper {

        repeated Settings settings = 1;
    }

    message Settings {

        int32 id = 1;

        bool enable = 2;

        int32 value = 3;

        float ratio = 4;
    }
`;


/* ============================================================
   2. SETTINGS METADATA
   ============================================================ */

const settingsMetadata = [

    {"ID":1,"Name":"ModeTemplateID","Type":"int"},
    {"ID":3,"Name":"HumanCanRevive","Type":"boolean"},
    {"ID":4,"Name":"BotCanRevive","Type":"boolean"},
    {"ID":5,"Name":"ReviveCDTime","Type":"int"},
    {"ID":6,"Name":"TeamNum","Type":"int"},
    {"ID":7,"Name":"TeamMemberNum","Type":"int"},
    {"ID":8,"Name":"RoundCount","Type":"int"},
    {"ID":9,"Name":"RoundTime","Type":"int"},
    {"ID":10,"Name":"ResetEquipment","Type":"boolean"},
    {"ID":11,"Name":"SafeZoneEnabled","Type":"boolean"},
    {"ID":12,"Name":"SafeZoneSize","Type":"float"},
    {"ID":13,"Name":"SafeZoneStartTime","Type":"float"},
    {"ID":14,"Name":"SafeZoneDamage","Type":"float"},
    {"ID":15,"Name":"MaxHP","Type":"int"},
    {"ID":16,"Name":"MaxEP","Type":"int"},
    {"ID":17,"Name":"StartEP","Type":"int"},
    {"ID":18,"Name":"AutoHealing","Type":"boolean"},
    {"ID":19,"Name":"Damage","Type":"int"},
    {"ID":20,"Name":"Damaged","Type":"int"},
    {"ID":21,"Name":"MoveSpeed","Type":"float"},
    {"ID":22,"Name":"JumpHeight","Type":"float"},
    {"ID":23,"Name":"LimitedAmmo","Type":"boolean"},
    {"ID":24,"Name":"TargetScore","Type":"int"},
    {"ID":25,"Name":"KillingScore","Type":"int"},
    {"ID":26,"Name":"ReviveRule","Type":"int"},
    {"ID":27,"Name":"MultiRoundsEnabled","Type":"boolean"},
    {"ID":28,"Name":"SafeZoneShrinkTime","Type":"float"},
    {"ID":29,"Name":"RoundPreparingTime","Type":"int"},
    {"ID":30,"Name":"EnableActiveSkill","Type":"boolean"},
    {"ID":31,"Name":"EnablePassiveSkill","Type":"boolean"},

    {"ID":75,"Name":"EcoRoundMoney","Type":"int"},

let UGCProjectDataType = null;

let originalMessage = null;

let originalFileName = "";


/* ============================================================
   6. KHỞI TẠO PROTOBUF
   ============================================================ */

function initProtobuf() {

    const loadingEl =
        document.getElementById("loadingIndicator");

    const uploadBox =
        document.getElementById("uploadBox");


    if (typeof protobuf === "undefined") {

        loadingEl.className =
            "status-msg error-box";

        loadingEl.textContent =
            "❌ Không thể tải thư viện Protobuf. Hãy kiểm tra kết nối mạng.";

        return;
    }


    try {

        const root =
            protobuf
                .parse(
                    protoSchema,
                    { keepCase: true }
                )
                .root;


        UGCProjectDataType =
            root.lookupType(
                "UGCProjectData"
            );


        const testMsg =
            UGCProjectDataType.create({});


        UGCProjectDataType
            .encode(testMsg)
            .finish();


        loadingEl.classList.add(
            "hidden"
        );

        uploadBox.classList.remove(
            "disabled"
        );


    } catch (e) {

        loadingEl.className =
            "status-msg error-box";

        loadingEl.textContent =
            "❌ Lỗi khởi tạo Protobuf: " +
            e.message;
    }
}


if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initProtobuf
    );

} else {

    initProtobuf();
}


/* ============================================================
   7. CHỌN FILE
   ============================================================ */

document
    .getElementById("uploadBox")
    .addEventListener(
        "click",
        function () {

            if (!UGCProjectDataType) {

                showError(
                    "Hệ thống chưa sẵn sàng. Vui lòng đợi một chút rồi thử lại."
                );

                return;
            }

            document
                .getElementById("fileInput")
                .click();
        }
    );


/* ============================================================
   8. ĐỌC FILE
   ============================================================ */

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        function (e) {

            const file =
                e.target.files[0];

            if (!file) return;


            if (!UGCProjectDataType) {

                showError(
                    "UGCProjectDataType chưa được tải."
                );

                return;
            }


            originalFileName =
                file.name;


            const reader =
                new FileReader();


            reader.onload =
                function (ev) {

                    try {

                        originalMessage =
                            UGCProjectDataType.decode(
                                new Uint8Array(
                                    ev.target.result
                                )
                            );


                        displaySettings();


                        document
                            .getElementById(
                                "infoBox"
                            )
                            .classList.remove(
                                "hidden"
                            );


                        document
                            .getElementById(
                                "errorBox"
                            )
                            .classList.add(
                                "hidden"
                            );


                    } catch (err) {

                        showError(
                            "Không thể đọc file: " +
                            err.message
                        );
                    }
                };


            reader.readAsArrayBuffer(
                file
            );
        }
    );

    return (
        vietnameseNames[name]
        ||
        name

}

   10. HIỂN THỊ LỖI
   ============================================================ */

    const errorBox =
        document.getElementById(
            "errorBox"

    errorBox.textContent =
        "❌ " + message;

    errorBox.classList.remove(
        "hidden"

/* ============================================================
   11. HIỂN THỊ SETTINGS
   ============================================================ */

function displaySettings() {

    const container =
        document.getElementById(
            "settingsContainer"
        );


    container.innerHTML = "";


    document
        .getElementById(
            "buttonGroup"
        )
        .classList.remove(
            "hidden"
        );


    const fileSettings = [];


    /*
       LƯU Ý:
       ShahGCreator là tên field protobuf.
       KHÔNG ĐỔI TÊN NÀY.
    */

    if (
        originalMessage.ShahGCreator &&
        Array.isArray(
            originalMessage
                .ShahGCreator
                .settings
        )
    ) {

        originalMessage
            .ShahGCreator
            .settings
            .forEach(wrapper => {

                if (
                    wrapper &&
                    Array.isArray(
                        wrapper.settings
                    )
                ) {

                    fileSettings.push(
                        ...wrapper.settings
                    );
                }
            });
    }


    for (
        const [
            categoryName,
            settingNames
        ]
        of Object.entries(
            categoryMapping
        )
    ) {


        const section =
            document.createElement(
                "div"
            );

        section.className =
            "category-section";


        const header =
            document.createElement(
                "div"
            );

        header.className =
            "category-header";

        header.textContent =
            categoryName;


        section.appendChild(
            header
        );


        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "settings-grid";


        settingNames.forEach(
            settingName => {

                const meta =
                    settingsMetadata.find(
                        item =>
                            item.Name ===
                            settingName
                    );


                if (!meta) return;


                const data =
                    fileSettings.find(
                        item =>
                            item.id ===
                            meta.ID
                    )
                    ||
                    {
                        id: meta.ID,
                        value: 0,
                        ratio: 0,
                        enable: false
                    };


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "setting-item";


                const displayName =
                    getVietnameseName(
                        meta.Name
                    );


                if (
                    meta.Type ===
                    "boolean"
                ) {

                    item.innerHTML = `

                        <label
                            class="checkbox-container"
                        >

                            <span>
                                ${displayName}
                            </span>

                            <input
                                type="checkbox"
                                id="field_${meta.ID}"
                                ${data.enable ? "checked" : ""}
                            >

                        </label>

                    `;

                } else {

                    const isFloat =
                        meta.Type ===
                        "float";


                    const value =
                        isFloat
                            ? (
                                data.ratio || 0
                            )
                            : (
                                data.value || 0
                            );


                    item.innerHTML = `

                        <h3>
                            ${displayName}
                        </h3>

                        <input
                            type="number"
                            id="field_${meta.ID}"
                            value="${value}"
                            step="${isFloat ? "0.01" : "1"}"
                        >

                    `;
                }


                grid.appendChild(
                    item
                );
            }
        );


        section.appendChild(
            grid
        );


        container.appendChild(
            section
        );
    }
}


/* ============================================================
   12. LƯU FILE
   ============================================================ */

document
    .getElementById("downloadBtn")
    .addEventListener(
        "click",
        function () {

            try {

                if (
                    !UGCProjectDataType
                ) {

                    showError(
                        "Hệ thống Protobuf chưa sẵn sàng."
                    );

                    return;
                }


                if (!originalMessage) {

                    showError(
                        "Chưa có file nào được tải lên."
                    );

                    return;
                }


                /*
                   KHÔNG ĐỔI ShahGCreator
                */

                if (
                    !originalMessage.ShahGCreator
                ) {

                    originalMessage.ShahGCreator = {

                        settings: [],

                        version: 0
                    };
                }


                if (
                    !Array.isArray(
                        originalMessage
                            .ShahGCreator
                            .settings
                    )
                    ||
                    originalMessage
                        .ShahGCreator
                        .settings
                        .length === 0
                ) {

                    originalMessage
                        .ShahGCreator
                        .settings = [

                            {
                                settings: []
                            }

                        ];
                }


                const wrapper =
                    originalMessage
                        .ShahGCreator
                        .settings[0];


                const settingsTargetList =
                    wrapper.settings
                    ||
                    (
                        wrapper.settings =
                            []
                    );


                settingsMetadata.forEach(
                    meta => {

                        const element =
                            document.getElementById(
                                `field_${meta.ID}`
                            );


                        if (!element) return;


                        let target =
                            settingsTargetList.find(
                                setting =>
                                    setting.id ===
                                    meta.ID
                            );


                        if (!target) {

                            target = {

                                id: meta.ID,

                                enable: false,

                                value: 0,

                                ratio: 0
                            };


                            settingsTargetList.push(
                                target
                            );
                        }


                        if (
                            meta.Type ===
                            "boolean"
                        ) {

                            target.enable =
                                element.checked;

                        }

                        else if (
                            meta.Type ===
                            "float"
                        ) {

                            target.ratio =
                                parseFloat(
                                    element.value
                                ) || 0;

                        }

                        else {

                            target.value =
                                parseInt(
                                    element.value,
                                    10
                                ) || 0;
                        }

                    }
                );


                const buffer =
                    UGCProjectDataType
                        .encode(
                            originalMessage
                        )
                        .finish();


                const blob =
                    new Blob(
                        [buffer],
                        {
                            type:
                                "application/octet-stream"
                        }
                    );


                const downloadLink =
                    document.createElement(
                        "a"
                    );


                downloadLink.href =
                    URL.createObjectURL(
                        blob
                    );


                downloadLink.download =
                    originalFileName
                    ||
                    "ProjectData_slot_x.bytes";


                document.body.appendChild(
                    downloadLink
                );


                downloadLink.click();


                document.body.removeChild(
                    downloadLink
                );


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            downloadLink.href
                        );

                    },
                    1000
                );


            } catch (error) {

                showError(
                    "Lỗi khi lưu file: " +
                    error.message
                );
            }
        }
    );

</script>
