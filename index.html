<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC Settings Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f4f7f9; color: #333; line-height: 1.5; }
        .container { max-width: 1100px; margin: 20px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a202c; color: #fff; padding: 30px; text-align: center; }
        .header h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .upload-section { padding: 25px; border-bottom: 1px solid #edf2f7; text-align: center; }
        .upload-box { border: 2px dashed #cbd5e0; border-radius: 8px; padding: 30px; cursor: pointer; transition: 0.2s; background: #fff; }
        .upload-box:hover { border-color: #4a90e2; background: #f8fbff; }
        .upload-box.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        input[type="file"] { display: none; }
        .category-section { margin: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .category-header { background: #edf2f7; padding: 12px 20px; font-weight: 700; font-size: 14px; color: #4a5568; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px; background: #e2e8f0; }
        .setting-item { background: #fff; padding: 15px 20px; display: flex; flex-direction: column; justify-content: center; }
        .setting-item h3 { font-size: 13px; color: #2d3748; margin-bottom: 8px; font-weight: 600; }
        input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 14px; }
        .checkbox-container { display: flex; align-items: center; justify-content: space-between; cursor: pointer; width: 100%; }
        .checkbox-container input { width: 18px; height: 18px; }
        .button-group { padding: 30px; text-align: center; }
        .btn { padding: 12px 35px; font-weight: 700; border-radius: 6px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-primary:hover { background: #357abd; }
        .status-msg { padding: 15px; margin: 15px 20px; border-radius: 6px; font-size: 14px; }
        .error-box { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; }
        .info-box { background: #ebf8ff; border: 1px solid #bee3f8; color: #2b6cb0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 UGC Settings Editor</h1>
        </div>

        <div id="loadingIndicator" class="status-msg info-box" style="text-align: center;">
            ⚙️ Đang tải thư viện Protobuf...
        </div>

        <div class="upload-section">
            <div class="upload-box disabled" id="uploadBox">
                <input type="file" id="fileInput" accept=".bin,.dat,.bytes,*">
                <span id="uploadText">📁 Nhấn để chọn file Map Project</span>
            </div>
        </div>

        <div id="infoBox" class="status-msg info-box hidden">✅ Đã tải file! Bạn có thể chỉnh sửa các cài đặt.</div>
        <div id="errorBox" class="status-msg error-box hidden"></div>

        <div id="settingsContainer"></div>

        <div class="button-group hidden" id="buttonGroup">
            <button class="btn btn-primary" id="downloadBtn">💾 Lưu &amp; Tải xuống</button>
        </div>
    </div>

    <!-- Load protobuf.js -->
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>

    <script>
    // ============================================================
    // 1) SCHEMA PROTOBUF (inline, không phụ thuộc /resource)
    // ============================================================
    const protoSchema = `
        syntax = "proto3";
        message UGCProjectData {
            bytes graph_editor_project = 1;
            bytes workflow_editor_project = 2;
            bytes entity_editor_project = 3;
            bytes hud_editor_project = 4;
            bytes map_editor_project = 5;
            Root ShahGCreator = 6;
            uint64 author_uid = 7;
            bytes custom_resources_package = 8;
            bytes timeline_editor_project = 9;
            bytes user_custom_event_editor_project = 10;
            int32 compatible_version = 999;
            int32 public_version = 1000;
        }
        message Root {
            repeated SettingsWrapper settings = 1;
            int32 version = 3;
        }
        message SettingsWrapper {
            repeated Settings settings = 1;
        }
        message Settings {
            int32 id = 1;
            bool enable = 2;
            int32 value = 3;
            float ratio = 4;
        }
    `;

    // ============================================================
    // 2) METADATA CỦA SETTINGS
    // ============================================================
    const settingsMetadata = [
        {"ID":1,"Name":"ModeTemplateID","Type":"int"},
        {"ID":3,"Name":"HumanCanRevive","Type":"boolean"},
        {"ID":4,"Name":"BotCanRevive","Type":"boolean"},
        {"ID":5,"Name":"ReviveCDTime","Type":"int"},
        {"ID":6,"Name":"TeamNum","Type":"int"},
        {"ID":7,"Name":"TeamMemberNum","Type":"int"},
        {"ID":8,"Name":"RoundCount","Type":"int"},
        {"ID":9,"Name":"RoundTime","Type":"int"},
        {"ID":10,"Name":"ResetEquipment","Type":"boolean"},
        {"ID":11,"Name":"SafeZoneEnabled","Type":"boolean"},
        {"ID":12,"Name":"SafeZoneSize","Type":"float"},
        {"ID":13,"Name":"SafeZoneStartTime","Type":"float"},
        {"ID":14,"Name":"SafeZoneDamage","Type":"float"},
        {"ID":15,"Name":"MaxHP","Type":"int"},
        {"ID":16,"Name":"MaxEP","Type":"int"},
        {"ID":17,"Name":"StartEP","Type":"int"},
        {"ID":18,"Name":"AutoHealing","Type":"boolean"},
        {"ID":19,"Name":"Damage","Type":"int"},
        {"ID":20,"Name":"Damaged","Type":"int"},
        {"ID":21,"Name":"MoveSpeed","Type":"float"},
        {"ID":22,"Name":"JumpHeight","Type":"float"},
        {"ID":23,"Name":"LimitedAmmo","Type":"boolean"},
        {"ID":24,"Name":"TargetScore","Type":"int"},
        {"ID":25,"Name":"KillingScore","Type":"int"},
        {"ID":26,"Name":"ReviveRule","Type":"int"},
        {"ID":27,"Name":"MultiRoundsEnabled","Type":"boolean"},
        {"ID":28,"Name":"SafeZoneShrinkTime","Type":"float"},
        {"ID":29,"Name":"RoundPreparingTime","Type":"int"},
        {"ID":30,"Name":"EnableActiveSkill","Type":"boolean"},
        {"ID":31,"Name":"EnablePassiveSkill","Type":"boolean"},
        {"ID":75,"Name":"EcoRoundMoney","Type":"int"},
        {"ID":76,"Name":"EcoKillMoney","Type":"int"},
        {"ID":77,"Name":"EcoWinMoney","Type":"int"},
        {"ID":78,"Name":"CoinHudShow","Type":"boolean"},
        {"ID":79,"Name":"ReviveSwitch","Type":"boolean"},
        {"ID":82,"Name":"MinNumOfMatchStart","Type":"int"},
        {"ID":88,"Name":"PetEnable","Type":"boolean"},
        {"ID":89,"Name":"PetSkillEnable","Type":"boolean"},
        {"ID":99,"Name":"CameraType","Type":"int"},
        {"ID":100,"Name":"CameraFov","Type":"int"},
        {"ID":101,"Name":"CameraPitch","Type":"float"},
        {"ID":102,"Name":"CameraYaw","Type":"float"},
        {"ID":103,"Name":"CameraDistance","Type":"float"},
        {"ID":104,"Name":"CameraOffset","Type":"int"},
        {"ID":129,"Name":"ObserverMode","Type":"int"},
        {"ID":130,"Name":"ObserverModeEnable","Type":"boolean"},
        {"ID":132,"Name":"CameraProjectionMode","Type":"int"},
        {"ID":133,"Name":"CameraBlockMode","Type":"int"},
        {"ID":134,"Name":"MorphModeDisableTemplate","Type":"boolean"},
        {"ID":135,"Name":"RecommendStartGameNumber","Type":"int"},
        {"ID":136,"Name":"EnableHalfwayJoin","Type":"boolean"},
        {"ID":137,"Name":"HalfwayJoinEffectTime","Type":"int"},
        {"ID":138,"Name":"HalfwayJoinNumberLimit","Type":"boolean"},
        {"ID":139,"Name":"HalfwayJoinNumber","Type":"int"},
        {"ID":140,"Name":"EnableHalfwayJoinEffectTime","Type":"boolean"},
        {"ID":141,"Name":"EnableWeaponSkinProperty","Type":"boolean"},
        {"ID":142,"Name":"EnableWeaponSkillProperty","Type":"boolean"},
        {"ID":143,"Name":"EnableDeathObserve","Type":"boolean"},
        {"ID":144,"Name":"UnlimitedBullet","Type":"boolean"},
        {"ID":145,"Name":"UnlimitedGloowall","Type":"boolean"},
        {"ID":146,"Name":"UnlimitedThrowables","Type":"boolean"},
        {"ID":147,"Name":"TwoDimensionCamEnableZAxis","Type":"boolean"},
        {"ID":148,"Name":"EnableFreeQuit","Type":"boolean"},
        {"ID":149,"Name":"AllowHangUpTime","Type":"int"},
        {"ID":150,"Name":"DisableReconnect","Type":"boolean"},
        {"ID":151,"Name":"EnableTotalToken","Type":"boolean"},
        {"ID":152,"Name":"EnableUGCToken","Type":"boolean"},
        {"ID":153,"Name":"EnableMiniMapV2","Type":"boolean"},
        {"ID":154,"Name":"DisableDepthMap","Type":"boolean"},
        {"ID":155,"Name":"EnableRuntimeDynamicNavMesh","Type":"boolean"},
        {"ID":156,"Name":"EnableEnergySavingMode","Type":"boolean"},
        {"ID":170,"Name":"EnableInventoryDrop","Type":"boolean"},
        {"ID":171,"Name":"UGCObserverCameraMode","Type":"int"},
        {"ID":172,"Name":"HideObserverDropButton","Type":"boolean"},
        {"ID":174,"Name":"IsDownFPPResource","Type":"boolean"},
        {"ID":175,"Name":"EnableQuickStartMatch","Type":"boolean"},
        {"ID":176,"Name":"EnablePveWeaponSkinProperty","Type":"boolean"},
        {"ID":177,"Name":"UGCIsShowSocialChooseBox","Type":"boolean"},
        {"ID":178,"Name":"EnableInternalWorkflowLogic","Type":"boolean"},
        {"ID":179,"Name":"EnableAOIFilter","Type":"boolean"},
        {"ID":180,"Name":"CameraViewingAngleRestrictionType","Type":"int"},
        {"ID":181,"Name":"IsHoudiniUsed","Type":"boolean"},
        {"ID":185,"Name":"DisableEnemyFootstepVibrate","Type":"boolean"},
        {"ID":187,"Name":"IsAIGenUsed","Type":"boolean"},
        {"ID":188,"Name":"GameStartTimeS","Type":"int"},
        {"ID":189,"Name":"GamePrepareTimeS","Type":"int"}
    ];

    // ============================================================
    // 3) DANH MỤC HIỂN THỊ
    // ============================================================
    const categoryMapping = {
        "Game Rules": ["GamePrepareTimeS","MultiRoundsEnabled","RoundCount","RoundTime","RoundPreparingTime","TeamNum","TeamMemberNum","MinNumOfMatchStart","AllowHangUpTime","EnableFreeQuit","DisableReconnect"],
        "Player & Stats": ["MaxHP","MaxEP","StartEP","Damage","Damaged","MoveSpeed","JumpHeight","AutoHealing","UnlimitedBullet","UnlimitedGloowall","UnlimitedThrowables","EnableInventoryDrop"],
        "Revive System": ["HumanCanRevive","BotCanRevive","ReviveCDTime","ReviveRule","ReviveSwitch"],
        "Game Observe Setting": ["EnableDeathObserve","ObserverModeEnable","ObserverMode","UGCObserverCameraMode"],
        "Economy": ["EnableTotalToken","EcoRoundMoney","EcoKillMoney","EcoWinMoney","CoinHudShow","EnableUGCToken"],
        "Safe Zone": ["SafeZoneEnabled","SafeZoneSize","SafeZoneStartTime","SafeZoneDamage","SafeZoneShrinkTime"],
        "Camera Settings": ["CameraType","CameraFov","CameraPitch","CameraYaw","CameraDistance","CameraOffset","CameraProjectionMode","CameraBlockMode","TwoDimensionCamEnableZAxis","CameraViewingAngleRestrictionType"],
        "Player Skill and Skin": ["EnableActiveSkill","EnablePassiveSkill","PetEnable","PetSkillEnable","EnableWeaponSkinProperty","EnableWeaponSkillProperty","EnablePveWeaponSkinProperty"],
        "Match Making Rules": ["RecommendStartGameNumber","EnableQuickStartMatch","GameStartTimeS","EnableHalfwayJoin","HalfwayJoinNumberLimit","HalfwayJoinNumber","EnableHalfwayJoinEffectTime","HalfwayJoinEffectTime"],
        "Advanced & System": ["EnableMiniMapV2","DisableDepthMap","EnableRuntimeDynamicNavMesh","EnableEnergySavingMode","IsDownFPPResource","UGCIsShowSocialChooseBox","EnableInternalWorkflowLogic","EnableAOIFilter","IsHoudiniUsed","DisableEnemyFootstepVibrate","IsAIGenUsed","MorphModeDisableTemplate"]
    };

    // ============================================================
    // 4) BIẾN TOÀN CỤC
    // ============================================================
    let UGCProjectDataType = null;   // <-- KHỞI TẠO NULL, KHÔNG ĐỂ UNDEFINED
    let originalMessage = null;
    let originalFileName = "";

    // ============================================================
    // 5) KHỞI TẠO PROTOBUF (chạy ngay, không cần setTimeout)
    // ============================================================
    function initProtobuf() {
        const loadingEl = document.getElementById('loadingIndicator');
        const uploadBox = document.getElementById('uploadBox');

        if (typeof protobuf === 'undefined') {
            loadingEl.className = 'status-msg error-box';
            loadingEl.textContent = '❌ Không tải được protobuf.js. Kiểm tra kết nối mạng / chặn CDN.';
            return;
        }

        try {
            const root = protobuf.parse(protoSchema, { keepCase: true }).root;
            UGCProjectDataType = root.lookupType("UGCProjectData");

            // Test encode/decode để chắc chắn type hợp lệ
            const testMsg = UGCProjectDataType.create({});
            UGCProjectDataType.encode(testMsg).finish();

            loadingEl.classList.add('hidden');
            uploadBox.classList.remove('disabled');
        } catch (e) {
            loadingEl.className = 'status-msg error-box';
            loadingEl.textContent = '❌ Lỗi khởi tạo schema: ' + e.message;
        }
    }

    // Gọi khởi tạo ngay sau khi DOM sẵn sàng
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initProtobuf);
    } else {
        initProtobuf();
    }

    // ============================================================
    // 6) UPLOAD FILE
    // ============================================================
    document.getElementById('uploadBox').addEventListener('click', function () {
        if (!UGCProjectDataType) {
            showError('Schema chưa sẵn sàng, vui lòng đợi 1-2 giây rồi thử lại.');
            return;
        }
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        if (!UGCProjectDataType) {
            showError('UGCProjectDataType chưa được định nghĩa. Hãy tải lại trang.');
            return;
        }

        originalFileName = file.name;
        const reader = new FileReader();
        reader.onload = function (ev) {
            try {
                originalMessage = UGCProjectDataType.decode(new Uint8Array(ev.target.result));
                displaySettings();
                document.getElementById('infoBox').classList.remove('hidden');
                document.getElementById('errorBox').classList.add('hidden');
            } catch (err) {
                showError('Lỗi giải mã: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // ============================================================
    // 7) HELPER
    // ============================================================
    function formatName(name) {
        return name.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()).trim();
    }

    function showError(m) {
        const eb = document.getElementById('errorBox');
        eb.textContent = '❌ ' + m;
        eb.classList.remove('hidden');
    }

    // ============================================================
    // 8) HIỂN THỊ SETTINGS
    // ============================================================
    function displaySettings() {
        const container = document.getElementById('settingsContainer');
        container.innerHTML = '';
        document.getElementById('buttonGroup').classList.remove('hidden');

        // Gom settings từ tất cả wrapper
        const fileSettings = [];
        if (originalMessage.ShahGCreator && Array.isArray(originalMessage.ShahGCreator.settings)) {
            originalMessage.ShahGCreator.settings.forEach(w => {
                if (w && Array.isArray(w.settings)) {
                    fileSettings.push(...w.settings);
                }
            });
        }

        for (const [catName, settingNames] of Object.entries(categoryMapping)) {
            const section = document.createElement('div');
            section.className = 'category-section';

            const header = document.createElement('div');
            header.className = 'category-header';
            header.textContent = catName;
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'settings-grid';

            settingNames.forEach(sName => {
                const meta = settingsMetadata.find(m => m.Name === sName);
                if (!meta) return;

                const data = fileSettings.find(d => d.id === meta.ID)
                    || { id: meta.ID, value: 0, ratio: 0, enable: false };

                const div = document.createElement('div');
                div.className = 'setting-item';

                if (meta.Type === 'boolean') {
                    div.innerHTML = `
                        <label class="checkbox-container">
                            <span>${formatName(meta.Name)}</span>
                            <input type="checkbox" id="field_${meta.ID}" ${data.enable ? 'checked' : ''}>
                        </label>`;
                } else {
                    const isFloat = meta.Type === 'float';
                    const val = isFloat ? (data.ratio || 0) : (data.value || 0);
                    div.innerHTML = `
                        <h3>${formatName(meta.Name)}</h3>
                        <input type="number" id="field_${meta.ID}" value="${val}" step="${isFloat ? '0.01' : '1'}">
                    `;
                }
                grid.appendChild(div);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }
    }

    // ============================================================
    // 9) LƯU & TẢI XUỐNG
    // ============================================================
    document.getElementById('downloadBtn').addEventListener('click', function () {
        try {
            if (!UGCProjectDataType) {
                return showError('UGCProjectDataType chưa được định nghĩa.');
            }
            if (!originalMessage) {
                return showError('Chưa có file nào được tải lên.');
            }

            if (!originalMessage.ShahGCreator) {
                originalMessage.ShahGCreator = { settings: [], version: 0 };
            }
            if (!Array.isArray(originalMessage.ShahGCreator.settings) || originalMessage.ShahGCreator.settings.length === 0) {
                originalMessage.ShahGCreator.settings = [{ settings: [] }];
            }

            const settingsTargetList = originalMessage.ShahGCreator.settings[0].settings
                || (originalMessage.ShahGCreator.settings[0].settings = []);

            settingsMetadata.forEach(meta => {
                const el = document.getElementById(`field_${meta.ID}`);
                if (!el) return;

                let target = settingsTargetList.find(s => s.id === meta.ID);
                if (!target) {
                    target = { id: meta.ID, enable: false, value: 0, ratio: 0 };
                    settingsTargetList.push(target);
                }

                if (meta.Type === 'boolean') {
                    target.enable = el.checked;
                } else if (meta.Type === 'float') {
                    target.ratio = parseFloat(el.value) || 0;
                } else {
                    target.value = parseInt(el.value, 10) || 0;
                }
            });

            const buffer = UGCProjectDataType.encode(originalMessage).finish();
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = originalFileName || 'ProjectData_slot_x.bytes';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        } catch (e) {
            showError('Lỗi lưu file: ' + e.message);
        }
    });
    </script>
</body>
</html>
