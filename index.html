<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shah G Creator Links</title>
    <style>
        :root {
            --primary-bg: #0f0f1f;
            --secondary-bg: #1a1a3a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #e0e0ff;
            --glow-github: #ffffff;
            --glow-youtube: #ff0000;
            --glow-telegram: #0088cc;
            --glow-facebook: #4267B2;
            --glow-instagram: #E1306C;
        }

        body {
            font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, var(--secondary-bg) 0%, var(--primary-bg) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            cursor: none;
        }

        .social-line {
            display: flex;
            flex-direction: column; /* Stack icons vertically */
            gap: 1.5rem;
            align-items: center; /* Center horizontally */
            padding: 2rem;
            transform-style: preserve-3d;
        }

        .social-icon {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: var(--text-color);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem 2rem;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            transform: rotateY(0deg) rotateX(0deg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 250px; /* Fixed width for consistency */
            justify-content: center; /* Center content inside card */
        }

        .social-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
            z-index: 0;
        }

        .social-icon:hover::before {
            left: 100%;
        }

        .social-icon:hover {
            transform: translateZ(20px) scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .social-icon img {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 0 8px var(--text-color));
            z-index: 1;
        }

        .social-icon span {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 1;
        }

        /* Platform-specific glows */
        .social-icon:nth-child(1):hover { /* GitHub */
            box-shadow: 0 0 20px var(--glow-github), 0 0 30px var(--glow-github);
        }
        .social-icon:nth-child(2):hover { /* YouTube */
            box-shadow: 0 0 20px var(--glow-youtube), 0 0 30px var(--glow-youtube);
        }
        .social-icon:nth-child(3):hover { /* Telegram */
            box-shadow: 0 0 20px var(--glow-telegram), 0 0 30px var(--glow-telegram);
        }
        .social-icon:nth-child(4):hover { /* Facebook */
            box-shadow: 0 0 20px var(--glow-facebook), 0 0 30px var(--glow-facebook);
        }
        .social-icon:nth-child(5):hover { /* Instagram */
            box-shadow: 0 0 20px var(--glow-instagram), 0 0 30px var(--glow-instagram);
        }

        /* Parallax effect */
        .social-icon {
            transition: transform 0.2s ease;
        }

        /* Custom cursor */
        .cursor {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .cursor-trail {
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.15s ease;
        }

        /* Theme toggle button */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.6rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--text-color);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .social-icon {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    <div class="social-line">
        <a href="https://github.com/ShahGCreator" target="_blank" class="social-icon">
            <img src="/icons/gh.svg" alt="GitHub" width="36" height="36">
            <span>GitHub</span>
        </a>
        <a href="https://www.youtube.com/@ShahGCreator" target="_blank" class="social-icon">
            <img src="/icons/yt.svg" alt="YouTube" width="36" height="36">
            <span>YouTube</span>
        </a>
        <a href="https://t.me/ShahGCreator" target="_blank" class="social-icon">
            <img src="/icons/tg.svg" alt="Telegram" width="36" height="36">
            <span>Telegram</span>
        </a>
        <a href="https://facebook.com/@ShahGCreator" target="_blank" class="social-icon">
            <img src="/icons/fb.svg" alt="Facebook" width="36" height="36">
            <span>Facebook</span>
        </a>
        <a href="https://instagram.com/ShahGCreator" target="_blank" class="social-icon">
            <img src="/icons/ig.svg" alt="Instagram" width="36" height="36">
            <span>Instagram</span>
        </a>
    </div>
    <div class="cursor"></div>
    <div class="cursor-trail"></div>

    <script>
        // Theme toggle
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                document.documentElement.style.setProperty('--primary-bg', '#e0e0ff');
                document.documentElement.style.setProperty('--secondary-bg', '#f0f4f8');
                document.documentElement.style.setProperty('--card-bg', 'rgba(0, 0, 0, 0.05)');
                document.documentElement.style.setProperty('--card-border', 'rgba(0, 0, 0, 0.1)');
                document.documentElement.style.setProperty('--text-color', '#333');
            } else {
                document.documentElement.style.setProperty('--primary-bg', '#0f0f1f');
                document.documentElement.style.setProperty('--secondary-bg', '#1a1a3a');
                document.documentElement.style.setProperty('--card-bg', 'rgba(255, 255, 255, 0.05)');
                document.documentElement.style.setProperty('--card-border', 'rgba(255, 255, 255, 0.1)');
                document.documentElement.style.setProperty('--text-color', '#e0e0ff');
            }
        }

        // Parallax effect
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.social-icon');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                const rotateX = y / 100;
                const rotateY = -x / 100;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(20px)`;
            });
        });

        // Custom cursor
        const cursor = document.querySelector('.cursor');
        const trail = document.querySelector('.cursor-trail');
        document.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX - 10}px, ${e.clientY - 10}px)`;
            setTimeout(() => {
                trail.style.transform = `translate(${e.clientX - 5}px, ${e.clientY - 5}px)`;
            }, 50);
        });
    </script>
</body>
</html>
